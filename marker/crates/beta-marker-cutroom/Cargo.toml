[package]
name = "beta-marker-cutroom"
description = "Bundling, tickets, re-cuts, cutting reports and costing for BETA Marker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
beta-marker-roll.workspace = true
beta-marker-core.workspace = true
beta-marker-nest.workspace = true
beta-marker-match.workspace = true
beta-marker-plan = { path = "../beta-marker-plan" }
rust_xlsxwriter = { version = "0.95", default-features = false }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
qrcode = { version = "0.14.1", default-features = false }

flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
zip = { version = "7.2", default-features = false, features = ["deflate"] }
