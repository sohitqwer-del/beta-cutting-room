[package]
name = "beta-cutting-room"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
description = "Offline BETA Cutting Room desktop"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }
# Keep the audited, narrow HTML interface stable.
tauri-utils = "=2.10.2"
tauri-codegen = "=2.7.3"

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-macros = "=2.7.3"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
beta-marker-core = { path = "../../../crates/beta-marker-core" }
beta-marker-dxf = { path = "../../../crates/beta-marker-dxf" }
beta-marker-nest = { path = "../../../crates/beta-marker-nest" }
beta-marker-export = { path = "../../../crates/beta-marker-export" }
beta-marker-match = { path = "../../../crates/beta-marker-match" }
beta-marker-plan = { path = "../../../crates/beta-marker-plan" }
beta-marker-roll = { path = "../../../crates/beta-marker-roll" }
beta-marker-cutroom = { path = "../../../crates/beta-marker-cutroom" }
beta-pattern-core = { path = "../../../../pattern/crates/beta-pattern-core" }
beta-pattern-digitize = { path = "../../../../pattern/crates/beta-pattern-digitize" }


# Original permissive adapters replace transitive MPL helpers, not jagua-rs.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# Same matcher used by the opener; tests inspect scopes without launching a browser.
glob = "=0.3.4"
