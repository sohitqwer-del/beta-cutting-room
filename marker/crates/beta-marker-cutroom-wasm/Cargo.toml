[package]
name = "beta-marker-cutroom-wasm"
description = "Browser module: cut plans, rolls, spreading, bundles, tickets, marker reports and PLT import"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
beta-marker-api.workspace = true
beta-marker-core.workspace = true
beta-marker-export.workspace = true
beta-marker-match.workspace = true
beta-marker-nest.workspace = true
beta-marker-plan.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
# Workbooks read the clock for their creation time: use the JavaScript clock in the browser.
rust_xlsxwriter = { version = "0.95", default-features = false, features = ["wasm"] }
