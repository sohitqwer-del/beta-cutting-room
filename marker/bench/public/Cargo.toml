[package]
name = "beta-public-bench"
version = "0.7.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

# Keep this orchestration tool outside the product workspace.
[workspace]

[[bin]]
name = "beta-public-bench"
path = "main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde_json = "1.0"
sha2 = "0.10"
